  <section id="prep" class="screen" aria-label="対局の準備"></section>

  <section id="cam" class="screen" aria-label="カメラ">
    <div class="cam-view">
      <video id="cam-video" playsinline muted autoplay></video>
      <div class="cam-stage" id="cam-stage"><svg id="cam-svg" preserveAspectRatio="none"></svg></div>
      <div id="cam-layer"></div>
    </div>
    <div class="cam-band" id="cam-band"></div>
  </section>

  <section id="send" class="screen" aria-label="送る"><div class="center-box" id="send-box"></div></section>

  <section id="kv" class="screen" aria-label="棋譜"></section>

  <section id="handoff" class="screen" aria-label="ほかのアプリ・サイトへ"></section>
</div>
<div id="sheet" class="sheet-back" hidden></div>
