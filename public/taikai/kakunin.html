<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大会の棋譜の確認 — 映像を見ながら確かめて直す</title>
  <!-- 運営だけが、オーナーから受け取ったリンクで開くページ。検索に載せず、リンクの印(# のあと)をどこにも渡さない -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- 計測(gtag)は置かない。アドレスの # に入るための印があるため -->
  <style>
    /* 大会の棋譜あつめ(kifu.html)と同じ設え。PC・タブレットの横向きでは 映像 | 盤 | 手 の 3 列、狭い画面では縦に並べる */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; color: #222; background: #faf8f4;
      font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.6; -webkit-text-size-adjust: 100%;
    }
    header {
      position: sticky; top: 0; z-index: 5; background: #faf8f4; border-bottom: 1px solid #e5e1d8;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px;
    }
    header h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
    header select { flex: 1; min-width: 180px; }
    .grow { flex: 1; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid #d8d3c8; border-radius: 8px; background: #fff; color: #222;
      padding: 7px 12px; font-size: 14px; cursor: pointer; font-family: inherit; line-height: 1.4;
    }
    .btn-primary { background: #00695c; border-color: #00695c; color: #fff; font-weight: bold; }
    .btn-danger { color: #b3261e; border-color: #ecc8c0; }
    .btn.on { background: #e0f2ef; border-color: #00695c; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #00695c; outline-offset: 2px; }
    input[type=text], select {
      font-family: inherit; font-size: 15px; color: #222; border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; background: #fff;
    }
    .card { background: #fff; border: 1px solid #e5e1d8; border-radius: 12px; padding: 10px 12px; }
    .note { font-size: 12.5px; color: #888; margin: 4px 0 0; }
    .status { font-size: 13px; color: #666; }
    .status.dirty { color: #b26a00; font-weight: bold; }
    .status.err { color: #b3261e; }

    /* 映像 | 盤 | 手。名前とメモは映像の下。タブレットの縦や小さい PC では 2 列、スマホでは 映像 → 盤 → 手 → 名前 */
    .layout {
      display: grid; gap: 12px; padding: 12px; align-items: start;
      grid-template-columns: minmax(0, 1fr) 380px 300px;
      grid-template-areas: "video board moves" "meta board moves";
    }
    .a-video { grid-area: video; } .a-meta { grid-area: meta; } .a-board { grid-area: board; } .a-moves { grid-area: moves; }
    .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    video { width: 100%; max-height: 62vh; background: #000; border-radius: 10px; display: block; }
    .novideo { background: #eee; border-radius: 10px; padding: 40px 12px; text-align: center; color: #777; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; font-size: 14px; }
    .meta input, .meta select { width: 100%; }

    /* 盤 */
    .hand { min-height: 34px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13px; color: #666; }
    .hand .who { margin-right: 4px; }
    .hand button { border: 1px solid #d8d3c8; background: #fffaf0; border-radius: 6px; padding: 2px 6px; font-size: 16px; font-family: inherit; cursor: pointer; }
    .hand button.pick { background: #ffe8a8; border-color: #c99a1a; }
    .hand button:disabled { cursor: default; }
    .board {
      --sq: min(40px, calc((100vw - 32px) / 9));
      display: grid; grid-template-columns: repeat(9, var(--sq)); grid-template-rows: repeat(9, var(--sq));
      border: 2px solid #5b4a2c; background: #f3d9a0; width: max-content; margin: 0 auto;
    }
    .board button {
      width: var(--sq); height: var(--sq); border: 0; border-right: 1px solid #b89a5e; border-bottom: 1px solid #b89a5e;
      background: transparent; padding: 0; font-family: inherit; font-size: calc(var(--sq) * .62); line-height: 1; color: #111; cursor: default;
    }
    .board button.rot { transform: rotate(180deg); }
    .board button.pro { color: #b3261e; }
    .board button.from { background: #f6e3b4; }
    .board button.to { background: #f0c46c; }
    .board button.pick { background: #ffe08a; }
    .board button.can { background: #cfe8d9; cursor: pointer; }
    .board.input button { cursor: pointer; }
    .bar { font-size: 14px; }
    .bar b { color: #00695c; }
    .warnbar { background: #fff4e0; border: 1px solid #f0c27a; border-radius: 10px; padding: 8px 10px; font-size: 14px; }

    /* 手の一覧 */
    .moves { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 220px); overflow-y: auto; border: 1px solid #e5e1d8; border-radius: 10px; background: #fff; }
    .moves li { display: flex; gap: 8px; padding: 5px 10px; border-bottom: 1px solid #f0ece3; cursor: pointer; font-size: 15px; align-items: baseline; }
    .moves li .n { width: 2.4em; text-align: right; color: #999; font-variant-numeric: tabular-nums; }
    .moves li .mv { flex: 1; }
    .moves li .t { color: #888; font-variant-numeric: tabular-nums; font-size: 13px; }
    .moves li .tag { font-size: 11px; border-radius: 999px; padding: 0 6px; border: 1px solid currentColor; }
    .moves li .tag.w { color: #b26a00; }
    .moves li .tag.c { color: #00695c; }
    .moves li.sel { background: #e0f2ef; }
    .moves li.bad { color: #b3261e; background: #fdeeee; }
    .keys { font-size: 12px; color: #999; }
    .center { max-width: 560px; margin: 60px auto; padding: 0 16px; }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "video board" "meta board" "meta moves"; }
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "video" "board" "moves" "meta"; padding: 8px; }
      video { max-height: 40vh; }
      .moves { max-height: 50vh; }
      .keys { display: none; }
      header h1 { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="gate" class="center"><p>読み込んでいます…</p></div>

  <div id="app" hidden>
    <header>
      <h1 id="ev-name"></h1>
      <select id="game" aria-label="局"></select>
      <button class="btn" id="prev" title="前の局">◀</button>
      <button class="btn" id="next" title="次の局">▶</button>
      <span class="status" id="status"></span>
      <button class="btn btn-primary" id="save">保存</button>
    </header>

    <div class="layout">
      <section class="col a-video">
        <video id="v" controls playsinline muted preload="metadata"></video>
        <div class="novideo" id="novideo" hidden>この局の映像はありません。</div>
        <div class="row">
          <button class="btn" data-skip="-2">2 秒戻る</button>
          <button class="btn" data-skip="-0.2">少し戻る</button>
          <button class="btn" id="play">再生</button>
          <button class="btn" data-skip="0.2">少し進む</button>
          <button class="btn" data-skip="2">2 秒進む</button>
          <span class="grow"></span>
          <button class="btn" data-rate="0.5">0.5 倍</button>
          <button class="btn on" data-rate="1">1 倍</button>
          <button class="btn" data-rate="2">2 倍</button>
        </div>
        <label class="row" style="font-size:14px"><input type="checkbox" id="follow" checked> 再生に合わせて盤と手を動かす</label>
      </section>

      <section class="col a-meta">
        <div class="card meta">
          <span id="lbl-sente">先手</span><input type="text" id="sente" maxlength="40" placeholder="名前">
          <span id="lbl-gote">後手</span><input type="text" id="gote" maxlength="40" placeholder="名前">
          <span>メモ</span><input type="text" id="memo" maxlength="200" placeholder="例: 決勝 1 卓">
          <span>終わり方</span>
          <select id="end">
            <option value="">書かない</option><option>投了</option><option>詰み</option><option>千日手</option>
            <option>持将棋</option><option>切れ負け</option><option>反則負け</option><option>中断</option>
          </select>
        </div>
        <p class="keys">キー: ↑↓ 手を選ぶ ・ ←→ 2 秒(Shift で少し) ・ 空白 再生と停止 ・ Esc 直すのをやめる</p>
      </section>

      <section class="col a-board">
        <div class="hand" id="hand-top"></div>
        <div class="board" id="board"></div>
        <div class="hand" id="hand-bottom"></div>
        <div class="card bar" id="bar"></div>
        <div class="warnbar" id="warnbar" hidden></div>
      </section>

      <section class="col a-moves">
        <ul class="moves" id="moves"></ul>
        <div class="row">
          <button class="btn" id="kif">この局を KIF で保存</button>
          <button class="btn" id="zip">全部の局を ZIP</button>
          <button class="btn" id="flip">盤を回す</button>
        </div>
        <p class="note" id="zipnote"></p>
      </section>
    </div>
  </div>

  <script src="../js/usi-kif.js"></script>
  <script src="../js/taikai-shogi.js"></script>
  <script src="../js/vendor/hls.light.min.js"></script>
  <script>
  (function () {
    'use strict';
    var S = window.TaikaiShogi;
    var $ = function (id) { return document.getElementById(id); };
    var v = $('v');

    // ---- リンク: #e=<大会>&k=<印>&a=<API の名前>(&g=<開いている局>) ----
    var hp = new URLSearchParams(location.hash.slice(1));
    var EVENT = hp.get('e') || '', TOKEN = hp.get('k') || '', HOST = hp.get('a') || '';
    // 印を送ってよいのは、コマドリの API(AWS の東京の API Gateway)だけ
    if (!/^[a-f0-9]{24}$/.test(EVENT) || !TOKEN || !/^[a-z0-9]+\.execute-api\.ap-northeast-1\.amazonaws\.com$/.test(HOST)) {
      $('gate').innerHTML = '<h1 style="font-size:20px">大会の棋譜の確認</h1><p>このページは、受け取ったリンクから開いてください。リンクが途中で切れていると開けません。</p>';
      return;
    }
    var API = 'https://' + HOST + '/taikai/api/' + EVENT;

    function call(path, opts) {
      opts = opts || {};
      var headers = { 'x-komadori-token': TOKEN };
      if (opts.body) { headers['content-type'] = 'application/json'; }
      return fetch(API + path, { method: opts.method || 'GET', headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' })
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (b) {
            if (!r.ok) { var e = new Error(b.error || ('通信に失敗しました(' + r.status + ')')); e.status = r.status; e.body = b; throw e; }
            return b;
          });
        });
    }

    // ---- 表示の小道具 ----
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function mmss(t) { if (t == null) { return ''; } t = Math.max(0, Math.round(t)); var m = Math.floor(t / 60), s = t % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
    function jst(iso) {
      if (!iso) { return ''; }
      return new Date(iso).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function kifDate(iso) {
      if (!iso) { return ''; }
      var d = new Date(new Date(iso).getTime() + 9 * 3600e3), p = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getUTCFullYear() + '/' + p(d.getUTCMonth() + 1) + '/' + p(d.getUTCDate()) + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
    }
    function setStatus(t, cls) { var el = $('status'); el.textContent = t; el.className = 'status' + (cls ? ' ' + cls : ''); }

    // ---- 状態 ----
    var ev = null;          // { name, expiresAt, games: [...] }
    var game = null;        // 開いている局の中身(サーバーの答え)
    var moves = [];         // [{ usi, t, warnings, changed }]
    var version = 0;        // 保存した版(0 = まだ誰も直していない)
    var rp = null;          // TaikaiShogi.replay の答え
    var sel = 0;            // 選んでいる手(0 = 始まりの局面)
    var mode = 'view';      // 'view' 見る / 'fix' sel 手目を指し直す / 'add' sel 手目のあとに足す
    var pick = null;        // 盤で選んだ駒の升('77')か、持ち駒('hand:fu')
    var promo = null;       // 成る・成らないを選んでいる手 { from, to }
    var flip = false;
    var dirty = false;
    var lockUntil = null;   // 手を押して映像を戻したあと、その手の時刻までは盤を映像に合わせない
    var hls = null;

    function teai() { return game ? game.teai : '平手'; }
    function usis() { return moves.map(function (m) { return m.usi; }); }
    function recompute() { rp = S.replay(teai(), usis()); }
    function markDirty() { dirty = true; setStatus('保存していません', 'dirty'); }

    // ---- 大会と局 ----
    call('').then(function (d) {
      ev = d;
      $('gate').hidden = true; $('app').hidden = false;
      $('ev-name').textContent = d.name;
      document.title = d.name + ' — 棋譜の確認';
      fillGames();
      var want = hp.get('g');
      var i = Math.max(0, d.games.findIndex(function (g) { return g.jobId === want; }));
      if (d.games.length) { openGame(d.games[i].jobId); } else { setStatus('この大会にはまだ局がありません。'); }
    }).catch(function (e) {
      $('gate').innerHTML = '<h1 style="font-size:20px">大会の棋譜の確認</h1><p>' + esc(e.message) + '</p><p class="note">分からないときは、リンクを送ってきた人に聞いてください。</p>';
    });

    function gameLabel(g, i) {
      var who = [g.sente, g.gote].filter(Boolean).join(' 対 ');
      return (i + 1) + '. ' + jst(g.startDate) + (g.memo ? ' ' + g.memo : '') + (who ? ' ' + who : '') + ' ・ ' +
        (g.hasKif || g.edited ? g.plies + ' 手' : '棋譜なし') + (g.warnings && !g.edited ? ' ・ 要確認 ' + g.warnings : '') + (g.edited ? ' ・ 直した' : '');
    }
    function fillGames() {
      $('game').innerHTML = ev.games.map(function (g, i) { return '<option value="' + esc(g.jobId) + '">' + esc(gameLabel(g, i)) + '</option>'; }).join('');
      if (game) { $('game').value = game.jobId; }
    }
    function leaveOk() { return !dirty || confirm('直した所を保存していません。保存せずに移りますか。'); }
    $('game').addEventListener('change', function () {
      if (!leaveOk()) { $('game').value = game.jobId; return; }
      openGame($('game').value);
    });
    function step(d) {
      if (!ev || !game) { return; }
      var i = ev.games.findIndex(function (g) { return g.jobId === game.jobId; }) + d;
      if (i < 0 || i >= ev.games.length || !leaveOk()) { return; }
      openGame(ev.games[i].jobId);
    }
    $('prev').addEventListener('click', function () { step(-1); });
    $('next').addEventListener('click', function () { step(1); });
    window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

    function openGame(jobId) {
      setStatus('読み込んでいます…');
      return call('/games/' + encodeURIComponent(jobId)).then(function (d) {
        game = d;
        var src = d.edit ? d.edit.moves : (d.original ? d.original.moves : []);
        var warn = {};
        (d.original ? d.original.moves : []).forEach(function (m, i) { warn[i] = m; });
        moves = src.map(function (m, i) {
          // 直した版でも、元と同じ手のままなら「要確認」を残す
          var o = warn[i];
          return { usi: m.usi, t: m.t, warnings: o && o.usi === m.usi ? o.warnings : [], changed: !!(d.edit && (!o || o.usi !== m.usi)) };
        });
        version = d.edit ? d.edit.version : 0;
        var e = d.edit || {};
        $('sente').value = e.sente || ''; $('gote').value = e.gote || ''; $('memo').value = e.memo || ''; $('end').value = e.end || '';
        var handi = d.teai && d.teai !== '平手';
        $('lbl-sente').textContent = handi ? '下手' : '先手'; $('lbl-gote').textContent = handi ? '上手' : '後手';
        flip = d.orientation === 'sente_far';
        sel = 0; mode = 'view'; pick = null; promo = null; dirty = false; lockUntil = null;
        recompute();
        $('game').value = jobId;
        hp.set('g', jobId);
        history.replaceState(null, '', '#' + hp.toString());
        loadVideo(d.video);
        setStatus(d.edit ? (jst(d.edit.savedAt) + ' に保存した版') : (d.original ? (d.original.partial ? '途中までの棋譜(読み手の答え)' : '読み手の答えのまま') : 'まだ棋譜がありません'));
        render();
      }).catch(function (e) { setStatus(e.message, 'err'); });
    }

    // ---- 映像 ----
    function loadVideo(video) {
      if (hls) { hls.destroy(); hls = null; }
      v.removeAttribute('src'); v.load();
      var has = !!(video && (video.hls || video.url));
      v.hidden = !has; $('novideo').hidden = has;
      if (!has) { return; }
      if (video.hls && v.canPlayType('application/vnd.apple.mpegurl')) {
        v.src = video.hls;                                // Safari(iPad・Mac)は自分で HLS を読む
      } else if (video.hls && window.Hls && window.Hls.isSupported()) {
        hls = new window.Hls({ maxBufferLength: 20 });    // PC の Chrome・Edge は見る所だけ読む
        hls.loadSource(video.hls);
        hls.attachMedia(v);
      } else if (video.url) {
        v.src = video.url;                                // 断片が消えた局(30 日より前)はつないだ映像
      }
    }
    function seek(t) {
      if (t == null || v.hidden) { return; }
      v.currentTime = Math.max(0, t - 2);
      lockUntil = t;
    }
    $('play').addEventListener('click', function () { if (v.paused) { v.play().catch(function () {}); } else { v.pause(); } });
    v.addEventListener('play', function () { $('play').textContent = '止める'; });
    v.addEventListener('pause', function () { $('play').textContent = '再生'; });
    document.querySelectorAll('[data-skip]').forEach(function (b) {
      b.addEventListener('click', function () { v.currentTime = Math.max(0, v.currentTime + Number(b.dataset.skip)); lockUntil = null; });
    });
    document.querySelectorAll('[data-rate]').forEach(function (b) {
      b.addEventListener('click', function () {
        v.playbackRate = Number(b.dataset.rate);
        document.querySelectorAll('[data-rate]').forEach(function (x) { x.classList.toggle('on', x === b); });
      });
    });
    // 再生に合わせて、映像の時刻までに指された最後の手を選ぶ(直している間は動かさない)
    v.addEventListener('timeupdate', function () {
      if (!$('follow').checked || mode !== 'view' || !moves.length) { return; }
      var now = v.currentTime;
      if (lockUntil != null) { if (now < lockUntil - 0.05) { return; } lockUntil = null; }
      var n = 0;
      for (var i = 0; i < moves.length; i++) { if (moves[i].t != null && moves[i].t <= now) { n = i + 1; } }
      if (n !== sel && n < rp.positions.length) { sel = n; render(true); }
    });

    // ---- 盤 ----
    // いま盤に出す局面と、触って指せるか
    function shown() {
      if (mode === 'fix' && sel - 1 >= rp.positions.length) { mode = 'view'; }
      if (mode === 'add' && sel >= rp.positions.length) { mode = 'view'; }
      if (mode === 'fix') { return { pos: rp.positions[sel - 1], input: true }; }
      var i = Math.min(sel, rp.positions.length - 1);
      return { pos: rp.positions[i], input: mode === 'add', last: i > 0 ? S.parseMove(rp.positions[i - 1], moves[i - 1].usi) : null };
    }

    function render(fromVideo) {
      var sh = shown(), pos = sh.pos;
      var targets = [];
      if (sh.input && pick) {
        targets = pick.indexOf('hand:') === 0 ? S.dropTargets(pos, pick.slice(5)) : S.destinations(pos, pick);
      }
      var lastFrom = sh.last && sh.last.from ? '' + sh.last.from[0] + sh.last.from[1] : null;
      var lastTo = sh.last ? '' + sh.last.to[0] + sh.last.to[1] : null;
      var h = '';
      for (var r = 1; r <= 9; r++) {
        for (var c = 1; c <= 9; c++) {
          var d = flip ? 10 - r : r, s = flip ? c : 10 - c, k = '' + s + d;
          var p = pos.ban[k], cls = [];
          if (p) {
            var kind = S.kindOf(p);
            if (/^(to|ny|nk|ng|um|ry)$/.test(kind)) { cls.push('pro'); }
            if ((S.owner(p) === 'gote') !== flip) { cls.push('rot'); }
          }
          if (k === lastFrom) { cls.push('from'); }
          if (k === lastTo) { cls.push('to'); }
          if (k === pick) { cls.push('pick'); }
          if (targets.indexOf(k) >= 0) { cls.push('can'); }
          h += '<button data-sq="' + k + '" class="' + cls.join(' ') + '" aria-label="' + s + d + '">' + (p ? S.NAME[S.kindOf(p)] : '') + '</button>';
        }
      }
      $('board').innerHTML = h;
      $('board').classList.toggle('input', !!sh.input);
      var top = flip ? 'sente' : 'gote', bottom = flip ? 'gote' : 'sente';
      $('hand-top').innerHTML = handHtml(pos, top, sh.input);
      $('hand-bottom').innerHTML = handHtml(pos, bottom, sh.input);
      renderBar(sh);
      renderMoves(fromVideo);
    }

    function handHtml(pos, side, input) {
      var handi = teai() !== '平手';
      var who = side === 'sente' ? (handi ? '☗下手' : '☗先手') : (handi ? '☖上手' : '☖後手');
      var name = side === 'sente' ? $('sente').value : $('gote').value;
      var h = '<span class="who">' + esc(who + (name ? ' ' + name : '')) + (pos.teban === side ? ' ・ 手番' : '') + '</span>';
      ['hi', 'ka', 'ki', 'gi', 'ke', 'ky', 'fu'].forEach(function (k) {
        var n = pos.hands[side][k];
        if (!n) { return; }
        var can = input && pos.teban === side;
        h += '<button data-hand="' + k + '"' + (can ? '' : ' disabled') + (pick === 'hand:' + k && can ? ' class="pick"' : '') + '>' + S.NAME[k] + (n > 1 ? n : '') + '</button>';
      });
      return h;
    }

    function renderBar(sh) {
      var b = '', n = sel;
      if (promo) {
        b = '<div>成りますか。</div><div class="row" style="margin-top:6px"><button class="btn btn-primary" data-act="promote">成る</button><button class="btn" data-act="nopromote">成らない</button><button class="btn" data-act="cancel">やめる</button></div>';
      } else if (mode === 'fix') {
        b = '<div><b>' + n + ' 手目を指し直す</b>: 盤で、正しい手を指してください(駒を押して、行き先を押す)。</div><div class="row" style="margin-top:6px"><button class="btn" data-act="cancel">やめる</button></div>';
      } else if (mode === 'add') {
        b = '<div><b>' + (n + 1) + ' 手目を足す</b>: 盤で指すと、映像のいまの時刻と一緒に入ります。続けて何手でも足せます。</div><div class="row" style="margin-top:6px"><button class="btn" data-act="cancel">足すのをやめる</button></div>';
      } else if (n === 0) {
        b = '<div>始まりの局面(' + esc(teai()) + ')</div><div class="row" style="margin-top:6px"><button class="btn" data-act="add">1 手目の前に足す</button></div>';
      } else {
        var m = moves[n - 1];
        b = '<div>' + n + ' 手目 ' + esc(rp.labels[n - 1] || m.usi) + (m.t != null ? ' ・ 映像 ' + mmss(m.t) : '') + '</div>' +
          (m.warnings.length ? '<div class="note" style="color:#b26a00">要確認: ' + esc(m.warnings.join(' / ')) + '</div>' : '') +
          '<div class="row" style="margin-top:6px">' +
          // 合わない手より先は、局面が作れないので指し直せない(下の「書き直す」で扱う)
          (n <= rp.positions.length ? '<button class="btn" data-act="fix">この手を直す</button>' : '') +
          (n < rp.positions.length ? '<button class="btn" data-act="add">このあとに足す</button>' : '') +
          '<button class="btn" data-act="time" title="映像のいまの時刻をこの手に付けます">時刻をいまに</button>' +
          '<button class="btn btn-danger" data-act="del">消す</button></div>';
      }
      $('bar').innerHTML = b;
      var w = $('warnbar');
      if (rp.bad && !promo && mode !== 'fix') {
        w.hidden = false;
        w.innerHTML = '<div>' + rp.bad + ' 手目が、その前の局面と合いません(' + esc(S.plain(moves[rp.bad - 1].usi)) + ')。</div>' +
          '<div class="row" style="margin-top:6px"><button class="btn" data-act="fixbad">' + rp.bad + ' 手目を直す</button>' +
          '<button class="btn" data-act="rewrite">' + rp.bad + ' 手目から書き直す</button></div>';
      } else { w.hidden = true; }
    }

    function renderMoves(fromVideo) {
      var h = '<li data-i="0" class="' + (sel === 0 ? 'sel' : '') + '"><span class="n"></span><span class="mv">始まりの局面</span></li>';
      moves.forEach(function (m, i) {
        var n = i + 1, cls = [];
        if (n === sel) { cls.push('sel'); }
        if (rp.bad && n >= rp.bad) { cls.push('bad'); }
        h += '<li data-i="' + n + '" class="' + cls.join(' ') + '"><span class="n">' + n + '</span><span class="mv">' + esc(rp.labels[i] || ('合わない手 ' + S.plain(m.usi))) + '</span>' +
          (m.changed ? '<span class="tag c">直した</span>' : '') + (m.warnings.length ? '<span class="tag w">要確認</span>' : '') +
          '<span class="t">' + mmss(m.t) + '</span></li>';
      });
      var ul = $('moves');
      ul.innerHTML = h;
      var li = ul.querySelector('li.sel');
      if (li) {
        // 選んだ手が一覧の外なら、見える所へ(ページごとは動かさない)
        var top = li.offsetTop - ul.offsetTop, bottom = top + li.offsetHeight;
        if (top < ul.scrollTop || bottom > ul.scrollTop + ul.clientHeight) { ul.scrollTop = top - ul.clientHeight / 2; }
      }
    }

    $('moves').addEventListener('click', function (e) {
      var li = e.target.closest('li'); if (!li) { return; }
      var n = Number(li.dataset.i);
      mode = 'view'; pick = null; promo = null; sel = n;
      if (n > 0) { seek(moves[n - 1].t); }
      render();
    });

    $('board').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-sq]'); if (!b) { return; }
      var sh = shown(); if (!sh.input || promo) { return; }
      var k = b.dataset.sq, pos = sh.pos;
      if (pick) {
        var drop = pick.indexOf('hand:') === 0;
        var targets = drop ? S.dropTargets(pos, pick.slice(5)) : S.destinations(pos, pick);
        if (targets.indexOf(k) >= 0) {
          if (drop) { commit(S.dropUsi(pick.slice(5), k)); return; }
          var pr = S.promotion(pos, pick, k);
          if (pr === 'may') { promo = { from: pick, to: k }; render(); return; }
          commit(S.moveUsi(pick, k, pr === 'must'));
          return;
        }
      }
      pick = S.owner(pos.ban[k]) === pos.teban ? k : null;
      render();
    });
    function handClick(e) {
      var b = e.target.closest('button[data-hand]'); if (!b || b.disabled) { return; }
      var k = 'hand:' + b.dataset.hand;
      pick = pick === k ? null : k;
      render();
    }
    $('hand-top').addEventListener('click', handClick);
    $('hand-bottom').addEventListener('click', handClick);

    // 盤で指した 1 手を入れる
    function commit(usi) {
      pick = null; promo = null;
      if (mode === 'fix') {
        var m = moves[sel - 1];
        moves[sel - 1] = { usi: usi, t: m.t, warnings: m.usi === usi ? m.warnings : [], changed: m.changed || m.usi !== usi };
        mode = 'view';
      } else if (mode === 'add') {
        var t = v.hidden || isNaN(v.currentTime) ? null : Math.round(v.currentTime * 100) / 100;
        // 前の手より前の時刻は付けない(映像を進めずに続けて足したとき。分からない時刻にしておく)
        var prevT = null;
        for (var j = sel - 1; j >= 0 && prevT == null; j--) { prevT = moves[j].t; }
        if (t != null && prevT != null && t < prevT) { t = null; }
        moves.splice(sel, 0, { usi: usi, t: t, warnings: [], changed: true });
        sel += 1;
        // 足したあとの手が合わなくなったら、足すのを止めて知らせる
        recompute();
        if (rp.bad) { mode = 'view'; }
      }
      recompute();
      markDirty();
      render();
    }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) { return; }
      var act = b.dataset.act, n = sel;
      if (act === 'cancel') { mode = 'view'; pick = null; promo = null; }
      else if (act === 'promote' || act === 'nopromote') { var p = promo; commit(S.moveUsi(p.from, p.to, act === 'promote')); return; }
      else if (act === 'fix') { mode = 'fix'; pick = null; v.pause(); }
      else if (act === 'add') { mode = 'add'; pick = null; v.pause(); }
      else if (act === 'time') {
        if (v.hidden || isNaN(v.currentTime)) { return; }
        moves[n - 1].t = Math.round(v.currentTime * 100) / 100; moves[n - 1].changed = true; markDirty();
      } else if (act === 'del') {
        moves.splice(n - 1, 1); sel = n - 1; recompute(); markDirty();
      } else if (act === 'fixbad') {
        sel = rp.bad; mode = 'fix'; pick = null; seek(moves[sel - 1].t);
      } else if (act === 'rewrite') {
        if (!confirm(rp.bad + ' 手目から後ろの ' + (moves.length - rp.bad + 1) + ' 手を消して、盤で指し直します。')) { return; }
        moves.splice(rp.bad - 1); sel = moves.length; recompute(); mode = 'add'; pick = null; markDirty();
        if (moves.length) { seek(moves[moves.length - 1].t); }
      } else { return; }
      render();
    });

    $('flip').addEventListener('click', function () { flip = !flip; render(); });
    ['sente', 'gote', 'memo', 'end'].forEach(function (id) {
      $(id).addEventListener('input', function () { markDirty(); if (id !== 'memo' && id !== 'end') { render(); } });
    });

    // ---- キー(PC) ----
    document.addEventListener('keydown', function (e) {
      if (!game || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        if (mode !== 'view') { return; }
        var n = Math.max(0, Math.min(moves.length, sel + (e.key === 'ArrowDown' ? 1 : -1)));
        if (n !== sel) { sel = n; if (n > 0) { seek(moves[n - 1].t); } render(); }
        e.preventDefault();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        var dt = (e.shiftKey ? 0.2 : 2) * (e.key === 'ArrowLeft' ? -1 : 1);
        v.currentTime = Math.max(0, v.currentTime + dt); lockUntil = null; e.preventDefault();
      } else if (e.key === ' ') {
        if (v.paused) { v.play().catch(function () {}); } else { v.pause(); }
        e.preventDefault();
      } else if (e.key === 'Escape') {
        mode = 'view'; pick = null; promo = null; render();
      }
    });

    // ---- 保存 ----
    $('save').addEventListener('click', function () {
      if (!game) { return; }
      if (rp.bad) { setStatus(rp.bad + ' 手目が合っていないので、保存できません。直すか書き直してください。', 'err'); return; }
      $('save').disabled = true;
      setStatus('保存しています…');
      call('/games/' + encodeURIComponent(game.jobId) + '/edit', { method: 'POST', body: {
        baseVersion: version, moves: moves.map(function (m) { return { usi: m.usi, t: m.t }; }),
        sente: $('sente').value, gote: $('gote').value, memo: $('memo').value, end: $('end').value
      } }).then(function (r) {
        version = r.version; dirty = false;
        setStatus(jst(r.savedAt) + ' に保存しました');
        var g = ev.games.find(function (x) { return x.jobId === game.jobId; });
        if (g) { g.edited = { version: r.version, savedAt: r.savedAt }; g.plies = moves.length; g.sente = $('sente').value; g.gote = $('gote').value; g.memo = $('memo').value; fillGames(); }
      }).catch(function (e) {
        if (e.status === 409) {
          setStatus(e.message, 'err');
          if (confirm('ほかの人が先にこの局を保存しました。その版を読み込みますか(ここで直した所は消えます)。')) { dirty = false; openGame(game.jobId); }
        } else { setStatus('保存できませんでした: ' + e.message, 'err'); }
      }).then(function () { $('save').disabled = false; });
    });

    // ---- KIF ----
    function fileName(i, sente, gote, memo) {
      var base = String(memo || '').trim() || ('局' + (i + 1));
      var who = [sente, gote].map(function (x) { return String(x || '').trim(); }).filter(Boolean).join('-');
      if (who) { base += '_' + who; }
      return base.replace(/[\\\/:*?"<>|\r\n\t]+/g, '-').replace(/\s+/g, '_').slice(0, 60) + '.kifu';
    }
    function download(blob, name) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    $('kif').addEventListener('click', function () {
      if (!game) { return; }
      var n = rp.bad ? rp.bad - 1 : moves.length;
      var text = S.toKif({ teai: teai(), usis: usis().slice(0, n), sente: $('sente').value, gote: $('gote').value, memo: $('memo').value,
                           end: rp.bad ? '' : $('end').value, event: ev.name, startedAt: kifDate(game.startDate) });
      var i = ev.games.findIndex(function (g) { return g.jobId === game.jobId; });
      download(new Blob([text], { type: 'text/plain;charset=utf-8' }), fileName(i, $('sente').value, $('gote').value, $('memo').value));
      $('zipnote').textContent = rp.bad ? (rp.bad - 1) + ' 手目までを保存しました(その先は合っていません)。' : (dirty ? '保存していない直しも入っています。' : '');
    });

    $('zip').addEventListener('click', function () {
      if (!ev) { return; }
      var files = [], i = 0;
      $('zip').disabled = true;
      (function next() {
        if (i >= ev.games.length) {
          download(zip(files), (ev.name || '大会') + '_棋譜.zip');
          $('zipnote').textContent = files.length + ' 局を ZIP にしました(保存した版。保存していない直しは入りません)。';
          $('zip').disabled = false;
          return;
        }
        $('zipnote').textContent = (i + 1) + ' / ' + ev.games.length + ' 局目を読んでいます…';
        var idx = i++;
        call('/games/' + encodeURIComponent(ev.games[idx].jobId)).then(function (d) {
          var e = d.edit || {}, src = d.edit ? d.edit.moves : (d.original ? d.original.moves : []);
          var list = src.map(function (m) { return m.usi; });
          var r = S.replay(d.teai, list);
          if (r.bad) { list = list.slice(0, r.bad - 1); }
          var text = S.toKif({ teai: d.teai, usis: list, sente: e.sente, gote: e.gote, memo: e.memo, end: r.bad ? '' : e.end, event: ev.name, startedAt: kifDate(d.startDate) });
          if (text) { files.push({ name: fileName(idx, e.sente, e.gote, e.memo), text: text }); }
        }).catch(function () {}).then(next);
      })();
    });

    // 無圧縮の ZIP(taikai/kifu.html と同じ)。名前は UTF-8 の印(フラグ 11)を立てる
    var CRC = (function () {
      var t = [];
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) { c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; }
        t[n] = c >>> 0;
      }
      return t;
    })();
    function crc32(b) {
      var c = 0xFFFFFFFF;
      for (var i = 0; i < b.length; i++) { c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); }
      return (c ^ 0xFFFFFFFF) >>> 0;
    }
    function zip(files) {
      var enc = new TextEncoder(), parts = [], dir = [], off = 0;
      var d = new Date();
      var time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
      var date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
      var used = {};
      files.forEach(function (f) {
        var nm = f.name, j = 2;
        while (used[nm]) { nm = f.name.replace(/\.kifu$/, '_' + (j++) + '.kifu'); }
        used[nm] = true;
        var name = enc.encode(nm), data = enc.encode(f.text), crc = crc32(data);
        var h = new DataView(new ArrayBuffer(30));
        h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
        h.setUint16(8, 0, true); h.setUint16(10, time, true); h.setUint16(12, date, true);
        h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
        h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
        parts.push(h.buffer, name, data);
        var c = new DataView(new ArrayBuffer(46));
        c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
        c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, time, true);
        c.setUint16(14, date, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true);
        c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
        c.setUint32(42, off, true);
        dir.push(c.buffer, name);
        off += 30 + name.length + data.length;
      });
      var dirLen = dir.reduce(function (s, p) { return s + (p.byteLength || p.length); }, 0);
      var e = new DataView(new ArrayBuffer(22));
      e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
      e.setUint32(12, dirLen, true); e.setUint32(16, off, true);
      return new Blob(parts.concat(dir, [e.buffer]), { type: 'application/zip' });
    }
  })();
  </script>
</body>
</html>
