    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; display: flex; flex-direction: column; gap: 28px; }

    .shot { width: 100%; max-width: 520px; margin: 0 auto; border-radius: 16px; display: block; }

  <style>
    /* 共通ヘッダー（index.html 以外で同じもの）。スマホはメニューをボタンにまとめる（CSS だけ） */
    .nk-head { position: relative; z-index: 30; display: flex; align-items: center; margin: 0; padding: 12px 16px; background: #fff; border: 0; border-bottom: 1px solid #eee;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif; line-height: 1; text-align: left; box-sizing: border-box; }
    .nk-head * { box-sizing: border-box; }
    .nk-head .nk-logo { color: #111; text-decoration: none; font-weight: 900; font-size: 17px; letter-spacing: .28em; }
    .nk-head .nk-t { position: absolute; opacity: 0; pointer-events: none; }
    .nk-head .nk-b { margin: 0 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: #f2f2f4; color: #111;
      font-size: 13.5px; font-weight: 700; line-height: 1.4; cursor: pointer; user-select: none; }
    .nk-head .nk-b span, .nk-head .nk-b span::before, .nk-head .nk-b span::after { display: block; width: 14px; height: 2px; border-radius: 2px; background: currentColor; position: relative; }
    .nk-head .nk-b span::before, .nk-head .nk-b span::after { content: ""; position: absolute; left: 0; }
    .nk-head .nk-b span::before { top: -5px; }
    .nk-head .nk-b span::after { top: 5px; }
    .nk-head .nk-t:focus-visible + .nk-b { outline: 2px solid #e5672e; outline-offset: 2px; }
    .nk-head nav { display: none; position: absolute; right: 12px; top: calc(100% + 6px); min-width: 200px; margin: 0; padding: 6px; flex-direction: column;
      background: #fff; border: 1px solid #eee; border-radius: 16px; box-shadow: 0 14px 34px rgba(0,0,0,.14); }
    .nk-head .nk-t:checked ~ nav { display: flex; }
    .nk-head nav a { display: block; margin: 0; padding: 11px 14px; border-radius: 10px; color: #111; text-decoration: none; font-size: 15px; font-weight: 700; line-height: 1.4; }
    .nk-head nav a[aria-current] { color: #e5672e; }
    .nk-head a:focus-visible { outline: 2px solid #e5672e; outline-offset: 2px; }
    @media (min-width: 760px) {
      .nk-head { padding: 16px 24px; }
      .nk-head .nk-b { display: none; }

      .nk-head nav a { padding: 0; border-radius: 0; font-size: 14px; color: #555; }
      .nk-head nav a:hover { color: #111; }
      .nk-head nav a[aria-current] { color: #111; box-shadow: inset 0 -2px 0 #e5672e; }

  <script src="/js/vendor/qrcode.min.js"></script>
  <script>
  (function () {
    // App Store のキャンペーンの印に使うプロバイダ番号（App Store Connect のもの）。空のあいだは印を付けない
    var APPLE_PT = '';
    var IOS = 'https://apps.apple.com/jp/app/id6800334202';
    var ANDROID = 'https://play.google.com/store/apps/details?id=tokyo.nkkuma.komadori';

    var q = new URLSearchParams(location.search);
    var from = (q.get('from') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || 'direct';
    var iosUrl = APPLE_PT ? IOS + '?pt=' + APPLE_PT + '&ct=' + from + '&mt=8' : IOS;
    var androidUrl = ANDROID + '&referrer=' + encodeURIComponent('utm_source=' + from + '&utm_medium=site&utm_campaign=komadori_link');
    document.getElementById('to-ios').href = iosUrl;
    document.getElementById('to-android').href = androidUrl;

    var ua = navigator.userAgent;
    // iPadOS の Safari は「Mac」と名乗るので、指で触れるかどうかで見分ける
    var isIos = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    var os = isIos ? 'ios' : isAndroid ? 'android' : 'pc';

    if (os === 'pc') {
      document.getElementById('pc').hidden = false;
      try {
        var qr = qrcode(0, 'M');
        qr.addData('https://shogi.nkkuma.tokyo/komadori.html?from=' + from);
        qr.make();
        document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      } catch (e) { document.getElementById('pc').hidden = true; }
      gtag('event', 'komadori_link', { from: from, os: os });
      return;
    }

    // スマホは、その OS のストアを先頭に大きく出し、そのまま開く（?stay を付けると開かずにこのページに残る）
    var mine = document.getElementById(isIos ? 'to-ios' : 'to-android');
    mine.className = 'mine';
    var dest = isIos ? iosUrl : androidUrl;
    if (q.has('stay')) {
      gtag('event', 'komadori_link', { from: from, os: os });
      return;
    }
    var going = document.getElementById('going');
    going.textContent = (isIos ? 'App Store' : 'Google Play') + ' を開いています。開かないときは、下のボタンを押してください。';
    going.hidden = false;
    var moved = false;
    function go() { if (moved) { return; } moved = true; location.replace(dest); }
    gtag('event', 'komadori_link', { from: from, os: os, event_callback: go });
    setTimeout(go, 700);
  })();
  </script>
