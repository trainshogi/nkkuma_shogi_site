# 本番デプロイ: master への push（public/ 配下の変更時）で S3 + CloudFront へ反映
# 認証は OIDC（長期キー不要）。SHOGI_API_KEY は GitHub Secrets から注入。
# 変数/シークレット未設定の間はスキップ（安全）。初期設定手順: docs/CICD_SETUP.md
name: Deploy to S3

on:
  push:
    branches: [master]
    paths: ['public/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-s3
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Pre-deploy safety check (現本番の状態を確認)
        # 本番バケットは S3 バージョニング有効(Enabled)。上書きされる各オブジェクトの
        # 旧バージョンは S3 側に自動保持されるので、実体としてのバックアップは既にある
        # (復元手順: docs/CICD_SETUP.md のロールバック手段を参照。復元には
        #  s3:ListBucketVersions 等の追加権限が要るため、このCIロールには持たせず
        #  人が local-claude プロファイルで手動実施する設計)。
        # ここではデプロイ直前の本番オブジェクト数を記録し、想定外に少ない
        # (=何かの理由で本番が壊れている)場合はデプロイを中断する
        run: |
          count=$(aws s3api list-objects-v2 --bucket shogi.nkkuma.tokyo --query 'KeyCount' --output text)
          echo "現本番: $count 件のオブジェクト"
          if [ "$count" -lt 80 ]; then
            echo "::error::本番のオブジェクト数が少なすぎます($count件)。想定外の状態のためデプロイを中断します"
            exit 1
          fi

      - name: Inject API keys (replace placeholders in public/)
        # secrets コンテキストは if: 条件式では使えない（GitHub Actionsの仕様上の制限）ため、
        # 未設定チェックもこのステップの bash 内で行う
        env:
          SHOGI_API_KEY: ${{ secrets.SHOGI_API_KEY }}
          SHOGI_ALPHA_API_KEY: ${{ secrets.SHOGI_ALPHA_API_KEY }}
        run: |
          if [ -z "$SHOGI_API_KEY" ]; then
            echo "::error::secrets.SHOGI_API_KEY が未設定です。Settings → Secrets and variables → Actions → Secrets に追加してください。"
            exit 1
          fi
          # ※ "__API_KEY__" は "__ALPHA_API_KEY__" の部分文字列ではないため独立に置換できる
          hits=$(grep -rl "__API_KEY__" public/ || true)
          if [ -z "$hits" ]; then
            echo "::error::__API_KEY__ プレースホルダが public/ に見つかりません"
            exit 1
          fi
          echo "Injecting main key into $(echo "$hits" | wc -l | tr -d ' ') file(s)"
          # ログにキーを絶対に出さない（perl の置換は env 変数参照のみ）
          echo "$hits" | while read -r f; do
            perl -i -pe 's/__API_KEY__/$ENV{SHOGI_API_KEY}/g' "$f"
          done
          alpha_hits=$(grep -rl "__ALPHA_API_KEY__" public/ || true)
          if [ -n "$alpha_hits" ]; then
            if [ -z "$SHOGI_ALPHA_API_KEY" ]; then
              echo "::error::α版ページが __ALPHA_API_KEY__ を要求していますが secrets.SHOGI_ALPHA_API_KEY が未設定です。"
              exit 1
            fi
            echo "Injecting alpha key into $(echo "$alpha_hits" | wc -l | tr -d ' ') file(s)"
            echo "$alpha_hits" | while read -r f; do
              perl -i -pe 's/__ALPHA_API_KEY__/$ENV{SHOGI_ALPHA_API_KEY}/g' "$f"
            done
          fi

      - name: Sync to S3
        # deploy.sh と同一の除外リスト。ACL 無しは CloudFront が AccessDenied になるので必須。
        # video-alpha.html はα実験レーン(alphaブランチ + deploy-alpha.yml)が正本のため、
        # masterデプロイでは触らない(masterにはファイル自体を置かない。2026-07-22〜)
        # review/* は次のステップが Content-Disposition 付きで送る担当なので、ここでは触らない
        # (sync はヘッダを付けられない。二重に上げるとヘッダ無しの状態が一瞬できる)
        run: |
          aws s3 sync public/ s3://shogi.nkkuma.tokyo \
            --exclude "firebase.json" \
            --exclude "404.html" \
            --exclude "mentenanse/*" \
            --exclude "*.DS_Store" \
            --exclude ".git/*" \
            --exclude "video-alpha.html" \
            --exclude "review/*" \
            --acl public-read

      - name: Upload public/review/ with Content-Disposition (審査用の配布ファイル)
        # なぜ要るか: review/ 配下は「ブラウザで再生させたい」ではなく
        # 「端末に保存させたい」ファイルの置き場。iOS Safari は video/mp4 を
        # インライン再生してしまい、審査員が『写真に保存』にたどり着けない
        # (2026-08-16 実機で3分以上詰まり、Braveでしか保存できなかった)。
        # Content-Disposition: attachment を付けると Safari でも保存ダイアログになる。
        # aws s3 sync はこのヘッダを付けられないため、このステップが唯一の付与点。
        #
        # 触るときの注意:
        #  - 対象は public/review/ 配下のみ。HTML/JS に attachment が付くと
        #    サイト全体がダウンロードになる(= サイト崩壊)。上位ディレクトリを指さないこと
        #  - --acl public-read は必須。2026-08-16 に手動でメタデータだけ足したとき
        #    公開ACLが引き継がれず、審査提出URLが403になった
        #  - review/ を廃止するときはこのステップと次の検証ステップも一緒に消すこと
        #    (消し忘れるとデプロイが「対象0件」で落ちる = 黙って戻らない設計)
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=shogi.nkkuma.tokyo
          SRC=public/review

          if [ ! -d "$SRC" ]; then
            echo "::error::$SRC がありません。審査用の配布ファイル置き場が消えています。意図的な廃止ならこのステップも削除してください"
            exit 1
          fi

          count=0
          while IFS= read -r -d '' f; do
            key="review/${f#public/review/}"
            base="$(basename "$f")"
            # ヘッダは ASCII のみ安全。日本語ファイル名等では filename を省く
            # (省いてもブラウザは URL 末尾をファイル名に使う)
            case "$base" in
              *[!A-Za-z0-9._-]*) disp="attachment" ;;
              *)                 disp="attachment; filename=\"$base\"" ;;
            esac
            echo "attachment 付与: s3://$BUCKET/$key  [$disp]"
            aws s3 cp "$f" "s3://$BUCKET/$key" \
              --content-disposition "$disp" \
              --acl public-read \
              --only-show-errors
            count=$((count + 1))
          done < <(find "$SRC" -type f ! -name '.DS_Store' -print0)

          if [ "$count" -eq 0 ]; then
            echo "::error::$SRC にファイルが1件もありません。審査用サンプルが消えている可能性があります"
            exit 1
          fi
          echo "Content-Disposition: attachment を付けて $count 件を送りました"

      - name: Verify headers (attachment が付いた / 他へ漏れていない)
        # CloudFront の無効化より前に確認する。ここで落とせば CDN は旧キャッシュを
        # 出し続けるので、壊れた状態が公開されない
        shell: bash
        run: |
          set -euo pipefail
          BUCKET=shogi.nkkuma.tokyo
          ng=0

          # 1) review/ 配下には attachment が付いていること
          while IFS= read -r -d '' f; do
            key="review/${f#public/review/}"
            info=$(aws s3api head-object --bucket "$BUCKET" --key "$key" \
                     --query '[ContentDisposition,ContentType,ContentLength]' --output text)
            disp=$(printf '%s' "$info" | cut -f1)
            case "$disp" in
              attachment*) echo "OK   $key  [$info]" ;;
              *) echo "::error::$key に Content-Disposition: attachment が付いていません (実際: $disp)"; ng=1 ;;
            esac
          done < <(find public/review -type f ! -name '.DS_Store' -print0)

          # 2) review/ 以外へ漏れていないこと(サイトが全部ダウンロードになる事故のカナリア)
          for key in index.html js/site.js video-sample.mp4; do
            if ! disp=$(aws s3api head-object --bucket "$BUCKET" --key "$key" \
                          --query 'ContentDisposition' --output text 2>/dev/null); then
              echo "::warning::カナリア $key を確認できませんでした(キー名が変わった?)"
              continue
            fi
            case "$disp" in
              attachment*) echo "::error::$key にまで attachment が漏れています。review/ 以外に付けてはいけません"; ng=1 ;;
              *) echo "OK   $key  Content-Disposition=$disp" ;;
            esac
          done

          [ "$ng" -eq 0 ]

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ECK0AXFXSKK8W --paths '/*'
